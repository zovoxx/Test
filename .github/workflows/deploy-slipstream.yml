# Builds the Slipstream game (slipstream/) and deploys dist/ to GitHub Pages.
# Manual trigger only: Settings -> Pages -> Source: "GitHub Actions", then
# Actions -> "Deploy Slipstream to GitHub Pages" -> Run workflow.
name: Deploy Slipstream to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slipstream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slipstream/package-lock.json
      - run: npm ci
      - run: npm run check:tracks
      - run: npm run test:physics
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: slipstream/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
